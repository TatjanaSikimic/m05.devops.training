version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Build and Push image
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2Build and Push image"
          commands:
            - cd 1-deployment/
            - echo $PWD
            - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            - 'docker build -t $DOCKER_USERNAME/my-flask-image:latest .'
            - 'docker push $DOCKER_USERNAME/my-flask-image:latest'
      secrets:
        - name: DOCKER_TATJANA
  - name: Deploy
    dependencies:
      - Build and Push image
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Kubernetes"
          commands:
            - cd 1-deployment/
            - kubectl config use-context $(kubectl config get-contexts -o name)
            - kubectl create namespace "g2-tatjana" || true
            - kubectl config set-context --current --namespace="g2-tatjana"
            - kubectl apply -f deployment.yml
            - kubectl apply -f service.yml
            - kubectl rollout status deployment/flask-app
      secrets:
        - name: kubeconfig
  - name: Verify
    dependencies:
      - Deploy
    task:
      jobs:
        - name: Verify the service
          commands:
            - cd 1-deployment/
            - kubectl get svc flask-app
      secrets:
        - name: kubeconfig
